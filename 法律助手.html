<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法律智能助手 | AI Legal Agent</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: linear-gradient(135deg, #f0f4ff 0%, #e8edf5 50%, #f5f7fa 100%);
    color: #1e293b;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .app {
    width: 100%;
    max-width: 1100px;
    height: 100vh;
    max-height: 760px;
    background: #fff;
    display: flex;
    box-shadow: 0 8px 40px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.02);
    border-radius: 20px;
    overflow: hidden;
  }

  /* ===== Sidebar ===== */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: #f8f9fc;
    border-right: 1px solid #eef2f6;
    display: flex;
    flex-direction: column;
  }
  .sidebar-header { padding: 16px 14px 12px; border-bottom: 1px solid #eef2f6; flex-shrink: 0; }
  .btn-new {
    width: 100%; padding: 10px 0; border: 1px solid #d1d9e6; border-radius: 10px;
    background: #fff; color: #1e293b; font-size: 13px; font-weight: 500;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.2s ease;
  }
  .btn-new:hover { background: #eef2ff; border-color: #3b82f6; color: #2563eb; }
  .btn-new:active { transform: scale(0.98); }
  .btn-new svg { width: 16px; height: 16px; }

  .session-list { flex: 1; overflow-y: auto; padding: 10px; }
  .session-list::-webkit-scrollbar { width: 4px; }
  .session-list::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

  .session-item {
    padding: 10px 12px; border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    transition: all 0.15s ease; margin-bottom: 4px;
  }
  .session-item:hover { background: #eef2f6; }
  .session-item.active { background: #eef2ff; border-left: 3px solid #3b82f6; border-radius: 10px 6px 6px 10px; }
  .session-title {
    font-size: 13px; color: #475569; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; flex: 1; line-height: 1.4;
  }
  .session-item.active .session-title { color: #1e293b; font-weight: 500; }
  .session-del {
    width: 22px; height: 22px; border: none; border-radius: 6px;
    background: transparent; color: #94a3b8; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; transition: all 0.15s;
  }
  .session-item:hover .session-del { display: flex; }
  .session-del:hover { background: #fee2e2; color: #ef4444; }
  .sidebar-footer { padding: 12px 14px; border-top: 1px solid #eef2f6; font-size: 11px; color: #94a3b8; text-align: center; flex-shrink: 0; }

  /* ===== Main ===== */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .header {
    flex-shrink: 0; padding: 18px 28px 14px; border-bottom: 1px solid #eef2f6;
    display: flex; align-items: center; justify-content: space-between; background: #fff;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px; font-weight: 700; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(59,130,246,0.25);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .logo:hover { transform: scale(1.05) rotate(-3deg); box-shadow: 0 4px 16px rgba(59,130,246,0.35); }
  .header-title { font-size: 17px; font-weight: 600; color: #0f172a; line-height: 1.3; }
  .header-sub { font-size: 12px; color: #94a3b8; line-height: 1.3; margin-top: 2px; }

  .btn-icon {
    width: 36px; height: 36px; border: none; border-radius: 10px;
    background: #f1f4f9; color: #64748b; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s ease; position: relative; overflow: hidden; flex-shrink: 0;
  }
  .btn-icon:hover { background: #e2e8f0; color: #334155; transform: translateY(-1px); }
  .btn-icon:active { transform: scale(0.92); }
  .btn-icon svg { width: 18px; height: 18px; }

  /* ===== Messages ===== */
  .messages {
    flex: 1; overflow-y: auto; padding: 24px 28px 12px;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth; background: #fafbfc;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
  .messages::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

  /* ===== Bubble ===== */
  .msg { display: flex; gap: 12px; max-width: 82%; animation: msgIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes msgIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.bot { align-self: flex-start; }

  .msg-avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; transition: transform 0.2s ease;
  }
  .msg.user .msg-avatar {
    background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff;
    box-shadow: 0 2px 8px rgba(59,130,246,0.2);
  }
  .msg.bot .msg-avatar {
    background: linear-gradient(135deg, #475569, #334155); color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .msg:hover .msg-avatar { transform: scale(1.08); }

  .msg-bubble {
    padding: 14px 20px; border-radius: 16px;
    font-size: 14px; line-height: 1.75; word-break: break-word;
    position: relative; min-width: 48px;
  }
  .msg.user .msg-bubble {
    background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff;
    border-bottom-right-radius: 6px; box-shadow: 0 2px 12px rgba(59,130,246,0.15);
  }
  .msg.bot .msg-bubble {
    background: #ffffff; color: #1e293b; border: 1px solid #e8ecf2;
    border-bottom-left-radius: 6px; box-shadow: 0 1px 6px rgba(0,0,0,0.03);
  }
  .msg.bot .msg-bubble:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }

  /* ===== Markdown 渲染样式 ===== */
  .msg-bubble h1, .msg-bubble h2 { font-size: 16px; font-weight: 600; margin: 12px 0 6px; color: #0f172a; }
  .msg-bubble h3, .msg-bubble h4 { font-size: 15px; font-weight: 600; margin: 10px 0 4px; color: #0f172a; }
  .msg-bubble p { margin-bottom: 8px; line-height: 1.75; }
  .msg-bubble p:last-child { margin-bottom: 0; }
  .msg-bubble strong { color: #0f172a; }
  .msg-bubble ul, .msg-bubble ol { padding-left: 20px; margin: 4px 0 8px; }
  .msg-bubble li { margin-bottom: 4px; line-height: 1.7; }
  .msg.user .msg-bubble li { color: rgba(255,255,255,0.9); }
  .msg-bubble code {
    background: #f1f4f9; padding: 2px 8px; border-radius: 4px;
    font-size: 13px; font-family: "SF Mono", "Fira Code", monospace; color: #1e293b;
  }
  .msg.user .msg-bubble code { background: rgba(255,255,255,0.15); }
  .msg-bubble pre {
    background: #f1f4f9; padding: 12px 16px; border-radius: 8px;
    overflow-x: auto; margin: 8px 0; border: 1px solid #e8ecf2;
  }
  .msg-bubble pre code { background: none; padding: 0; }
  .msg-bubble blockquote {
    border-left: 3px solid #3b82f6; padding: 4px 12px; margin: 8px 0;
    color: #64748b; background: #f8fafc; border-radius: 0 6px 6px 0;
  }
  .msg-bubble table { border-collapse: collapse; margin: 8px 0; width: 100%; font-size: 13px; }
  .msg-bubble th, .msg-bubble td { border: 1px solid #e2e8f0; padding: 6px 12px; text-align: left; }
  .msg-bubble th { background: #f1f4f9; font-weight: 600; }
  .msg-bubble hr { border: none; border-top: 1px solid #e2e8f0; margin: 12px 0; }

  .source-tag {
    display: inline-block; background: #eef2ff; color: #4f6ef7;
    font-size: 11px; padding: 2px 10px; border-radius: 4px;
    margin: 1px 3px 1px 0; border: 1px solid #e0e7ff; font-weight: 500;
    transition: all 0.2s ease;
  }

  /* ===== 复制按钮 ===== */
  .msg-actions {
    display: flex; gap: 4px; justify-content: flex-end;
    opacity: 0; transition: opacity 0.2s ease; margin-top: 8px;
  }
  .msg.bot:hover .msg-actions { opacity: 1; }
  .msg-action-btn {
    padding: 4px 10px; border: none; border-radius: 6px;
    background: #f1f4f9; color: #64748b; font-size: 11px;
    cursor: pointer; display: flex; align-items: center; gap: 4px;
    transition: all 0.15s ease;
  }
  .msg-action-btn:hover { background: #e2e8f0; color: #334155; }
  .msg-action-btn.copied {
    background: #d1fae5; color: #059669;
  }
  .user-actions { margin-top: 6px; }

  /* ===== Typing ===== */
  .typing { display: flex; gap: 5px; padding: 6px 0; align-items: center; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: #94a3b8;
    animation: typing 1.4s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.16s; }
  .typing span:nth-child(3) { animation-delay: 0.32s; }
  @keyframes typing {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0) scale(1); }
    30% { opacity: 1; transform: translateY(-5px) scale(1.1); }
  }

  /* ===== Footer ===== */
  .footer { flex-shrink: 0; padding: 14px 28px 20px; border-top: 1px solid #eef2f6; background: #fff; }
  .input-row {
    display: flex; gap: 10px; background: #f1f4f9; border-radius: 14px;
    padding: 4px 4px 4px 18px; transition: all 0.3s ease;
    border: 2px solid transparent; align-items: flex-end;
  }
  .input-row:focus-within { background: #fff; border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,0.08); }
  .input-row textarea {
    flex: 1; border: none; background: transparent; padding: 10px 0;
    font-size: 14px; font-family: inherit; resize: none; outline: none;
    line-height: 1.5; min-height: 24px; max-height: 120px; color: #1e293b;
  }
  .input-row textarea::placeholder { color: #94a3b8; }
  .btn-send {
    width: 42px; height: 42px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: all 0.25s ease; box-shadow: 0 4px 12px rgba(59,130,246,0.25); position: relative; overflow: hidden;
  }
  .btn-send:hover { background: linear-gradient(135deg, #4b8df7, #2d6ef0); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59,130,246,0.35); }
  .btn-send:active { transform: scale(0.92); }
  .btn-send:disabled { background: #e2e8f0; box-shadow: none; color: #94a3b8; cursor: not-allowed; transform: none; }
  .footer-hint { text-align: right; font-size: 11px; color: #94a3b8; margin-top: 8px; padding-right: 4px; user-select: none; }

  /* ===== Welcome ===== */
  .welcome {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; flex: 1; padding: 20px; text-align: center;
    animation: fadeIn 0.6s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .welcome-icon {
    width: 72px; height: 72px; background: linear-gradient(135deg, #eef2ff, #dbeafe);
    border-radius: 36px; display: flex; align-items: center; justify-content: center;
    font-size: 32px; margin-bottom: 20px; transition: transform 0.4s ease;
  }
  .welcome:hover .welcome-icon { transform: scale(1.06) rotate(-5deg); }
  .welcome h2 { font-size: 22px; font-weight: 600; color: #0f172a; margin-bottom: 8px; }
  .welcome p { font-size: 14px; color: #64748b; line-height: 1.7; max-width: 420px; margin-bottom: 28px; }
  .welcome-tags { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 460px; }
  .welcome-tag {
    padding: 8px 20px; border-radius: 24px; background: #f1f4f9;
    color: #475569; font-size: 13px; cursor: pointer;
    transition: all 0.25s ease; border: 1px solid #e8ecf2;
    user-select: none; position: relative; overflow: hidden;
  }
  .welcome-tag:hover { border-color: #3b82f6; color: #2563eb; background: #eef2ff; transform: translateY(-3px); box-shadow: 0 6px 20px rgba(59,130,246,0.12); }
  .welcome-tag:active { transform: scale(0.95) translateY(-1px); }
  .hidden { display: none !important; }

  @media (max-width: 720px) {
    .app { border-radius: 0; max-height: none; }
    .sidebar { width: 200px; }
    .header { padding: 14px 16px 12px; }
    .messages { padding: 16px 14px 8px; }
    .footer { padding: 10px 14px 16px; }
    .welcome h2 { font-size: 18px; }
    .welcome-icon { width: 56px; height: 56px; font-size: 26px; }
    .msg { max-width: 92%; }
  }

  .ripple {
    position: absolute; border-radius: 50%;
    background: rgba(59, 130, 246, 0.2);
    transform: scale(0); animation: rippleAnim 0.6s ease-out;
    pointer-events: none;
  }
  @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }
</style>
</head>
<body>

<div class="app">
  <!-- 左侧会话面板 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <button class="btn-new" id="btnNewSession">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        新建对话
      </button>
    </div>
    <div class="session-list" id="sessionList"></div>
    <div class="sidebar-footer">会话保存在浏览器中</div>
  </div>

  <!-- 右侧主区域 -->
  <div class="main">
    <div class="header">
      <div class="header-left">
        <div class="logo">法</div>
        <div>
          <div class="header-title">法律智能助手</div>
          <div class="header-sub">30 部法律法规 · 多 Agent 协作</div>
        </div>
      </div>
      <button class="btn-icon" id="btnClear" title="清空当前对话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
      </button>
    </div>

    <div class="messages" id="msgArea">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">⚖️</div>
        <h2>有什么法律问题需要帮助？</h2>
        <p>涵盖劳动法、民法典、刑法、公司法等 30 部法律法规<br>智能检索 + 多 Agent 协同分析</p>
        <div class="welcome-tags">
          <span class="welcome-tag" data-q="试用期最长可以约定多久？">📋 试用期多久？</span>
          <span class="welcome-tag" data-q="离婚需要满足什么条件？">💔 离婚条件</span>
          <span class="welcome-tag" data-q="买到过期食品可以要求多少赔偿？">🛒 过期食品赔偿</span>
          <span class="welcome-tag" data-q="正当防卫需要满足什么条件？">🛡️ 正当防卫</span>
          <span class="welcome-tag" data-q="公司可以随便开除员工吗？">👔 开除员工</span>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="输入你的法律问题..." maxlength="1000"></textarea>
        <button class="btn-send" id="btnSend" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="footer-hint">Enter 发送 · Shift+Enter 换行</div>
    </div>
  </div>
</div>

<script>
// ===== 配置 =====
const API_BASE = 'http://localhost:8000';
const STORAGE_KEY = 'legal_ai_sessions';

// ===== DOM =====
const msgArea = document.getElementById('msgArea');
const input = document.getElementById('input');
const btnSend = document.getElementById('btnSend');
const welcome = document.getElementById('welcome');
const btnClear = document.getElementById('btnClear');
const btnNew = document.getElementById('btnNewSession');
const sessionList = document.getElementById('sessionList');

let activeSessionId = null;
let isLoading = false;
let msgCount = 0;

// ===== 配置 marked =====
marked.setOptions({
  breaks: true,
  gfm: true
});

// ===== 涟漪 =====
function ripple(e, el) {
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const x = e.clientX - rect.left - size / 2;
  const y = e.clientY - rect.top - size / 2;
  const r = document.createElement('span');
  r.className = 'ripple';
  r.style.width = r.style.height = size + 'px';
  r.style.left = x + 'px'; r.style.top = y + 'px';
  el.appendChild(r);
  setTimeout(() => r.remove(), 600);
}
document.querySelectorAll('.btn-icon, .btn-send, .btn-new, .welcome-tag').forEach(el => {
  el.addEventListener('click', function(e) { ripple(e, this); });
});

// ===== 会话管理 =====
function loadSessions() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; } }
function saveSessions(list) { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function renderSessionList() {
  const list = loadSessions();
  sessionList.innerHTML = '';
  list.forEach(s => {
    const item = document.createElement('div');
    item.className = 'session-item' + (s.id === activeSessionId ? ' active' : '');
    const title = document.createElement('div'); title.className = 'session-title'; title.textContent = s.title || '新对话';
    const del = document.createElement('button'); del.className = 'session-del'; del.innerHTML = '✕'; del.title = '删除对话';
    del.addEventListener('click', (e) => { e.stopPropagation(); deleteSession(s.id); });
    item.appendChild(title); item.appendChild(del);
    item.addEventListener('click', () => switchSession(s.id));
    sessionList.appendChild(item);
  });
}

function createSession() {
  const id = generateId();
  const list = loadSessions();
  list.unshift({ id, title: '新对话', createdAt: Date.now() });
  saveSessions(list);
  activeSessionId = id;
  renderSessionList();
  clearMessages();
  return id;
}

function deleteSession(id) {
  let list = loadSessions();
  list = list.filter(s => s.id !== id);
  saveSessions(list);
  if (id === activeSessionId) {
    if (list.length > 0) switchSession(list[0].id);
    else { activeSessionId = null; clearMessages(); renderSessionList(); }
  } else renderSessionList();
}

function switchSession(id) { activeSessionId = id; renderSessionList(); loadHistory(id); }

function clearMessages() { msgArea.querySelectorAll('.msg').forEach(m => m.remove()); welcome.classList.remove('hidden'); msgCount = 0; }

async function loadHistory(sessionId) {
  clearMessages();
  try {
    const res = await fetch(`${API_BASE}/history/${sessionId}`);
    if (!res.ok) return;
    const data = await res.json();
    if (data.messages && data.messages.length > 0) {
      welcome.classList.add('hidden');
      data.messages.forEach(m => addMessage(m.content, m.role === 'user' ? 'user' : 'bot', true));
      for (const m of data.messages) { if (m.role === 'user') { updateSessionTitle(sessionId, m.content.slice(0, 30)); break; } }
    }
  } catch {}
}

function updateSessionTitle(id, text) {
  let list = loadSessions();
  const s = list.find(x => x.id === id);
  if (s && s.title === '新对话' && text) { s.title = text; saveSessions(list); renderSessionList(); }
}

// ===== 输入 =====
input.addEventListener('input', () => {
  input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  btnSend.disabled = !input.value.trim() || isLoading;
});
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

// ===== 发送 =====
async function sendMessage(text) {
  text = text || input.value;
  if (!text.trim() || isLoading) return;
  if (!activeSessionId) createSession();

  isLoading = true; btnSend.disabled = true;
  welcome.classList.add('hidden');

  addMessage(text.trim(), 'user', false);
  updateSessionTitle(activeSessionId, text.trim().slice(0, 30));
  input.value = ''; input.style.height = 'auto';

  const typingEl = addTyping();

  try {
    const payload = { question: text.trim(), session_id: activeSessionId };
    const res = await fetch(`${API_BASE}/chat`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    typingEl.remove();
    addMessage(data.answer || '抱歉，暂时无法回答。', 'bot', false);
  } catch (err) {
    typingEl.remove();
    addMessage('⚠️ 网络连接失败，请确认服务正在运行。\n\n在终端中执行：\n```python\npython api_server.py\n```', 'bot', false);
  }

  isLoading = false; btnSend.disabled = !input.value.trim();
}

// ===== 添加消息（核心：Markdown + 复制按钮）=====
function addMessage(text, role, isHistory) {
  msgCount++;
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'user' ? '你' : '法';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  if (role === 'bot') {
    // 先替换【】标签，再渲染 Markdown ✓
    const tagged = text.replace(/【([^】]+)】/g, (match, p1) => {
      return `<span class="source-tag">${p1}</span>`;
    });
    bubble.innerHTML = marked.parse(tagged);

    // 添加操作按钮（复制）
    const actions = document.createElement('div');
    actions.className = 'msg-actions';

    const copyBtn = document.createElement('button');
    copyBtn.className = 'msg-action-btn';
    copyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> 复制';
    copyBtn.addEventListener('click', () => {
      // 复制纯文本版本
      const plainText = bubble.textContent;
      navigator.clipboard.writeText(plainText).then(() => {
        copyBtn.classList.add('copied');
        copyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><polyline points="20 6 9 17 4 12"></polyline></svg> 已复制';
        setTimeout(() => {
          copyBtn.classList.remove('copied');
          copyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> 复制';
        }, 2000);
      });
    });
    actions.appendChild(copyBtn);
    bubble.appendChild(actions);

  } else {
    bubble.textContent = text;
  }

  div.appendChild(avatar);
  div.appendChild(bubble);
  msgArea.appendChild(div);
  scrollToBottom();
  return div;
}

// ===== 思考中 =====
function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = '法';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  div.appendChild(avatar); div.appendChild(bubble);
  msgArea.appendChild(div);
  scrollToBottom();
  return div;
}

function scrollToBottom() { requestAnimationFrame(() => { msgArea.scrollTop = msgArea.scrollHeight; }); }

// ===== 事件 =====
btnSend.addEventListener('click', () => sendMessage());
document.querySelectorAll('.welcome-tag').forEach(tag => {
  tag.addEventListener('click', function(e) { sendMessage(this.dataset.q); });
});
btnClear.addEventListener('click', () => {
  if (!activeSessionId) return;
  msgArea.querySelectorAll('.msg').forEach(m => m.remove());
  welcome.classList.remove('hidden');
  msgCount = 0;
});
btnNew.addEventListener('click', () => createSession());

// ===== 初始化 =====
function init() {
  const list = loadSessions();
  if (list.length > 0) switchSession(list[0].id);
  else createSession();
  input.focus();
}
init();
</script>
